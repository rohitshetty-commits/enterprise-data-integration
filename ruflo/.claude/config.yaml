# Ruflo Harness Config (.claude/config.yaml)

version: "1.1.0"
project: enterprise-data-integration
description: AI-powered app builder and orchestration layer for React/FastAPI and Spring Boot ETL

harness:
  topology: mesh
  max_agents: 8
  coordination: ruflo
  memory_sharing: true

agents:
  primary:
    file: .agents/etl_orchestrator.yaml
  specialists:
    - .agents/interface_agent.yaml
    - .agents/gotham_agent.yaml
    - .agents/sql_agent.yaml
    - .agents/validation_agent.yaml
    - .agents/memory_agent.yaml

memory:
  backend: chromadb
  persist_path: ./chroma_db
  collection: enterprise_etl_knowledge
  embedding_model: all-MiniLM-L6-v2
  auto_learn: true

api:
  host: localhost
  port: 8000
  python_path: ./ai_agent
  start_command: "uvicorn ai_agent.api.main:app --reload --port 8000"

environment:
  required:
    - ANTHROPIC_API_KEY
  optional:
    - CHROMA_PATH
    - GITHUB_TOKEN
    - CLOUD_SYNC_ENABLED
    - SYNC_URLS
    - SYNC_GITHUB_REPO
    - ORACLE_DB_URL
    - ORACLE_DB_USER
    - ORACLE_DB_PASSWORD

logging:
  level: INFO
  file: ./logs/ruflo.log
  structured: true

hooks:
  pre_task:
    - query_knowledge_base
  post_task:
    - store_result
    - update_metrics
